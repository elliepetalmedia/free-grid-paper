# Build pipeline: TypeScript checks run first, then the build,
# then the regression tests, and the deploy fails if any of them
# fails. Tests run AFTER the build on purpose: tests/build-outputs
# verifies what the build actually produced in dist/public (every
# prerendered page, the sitemaps, the 404 pages, the service
# worker, and the indexing headers), so it needs a fresh dist to
# test against, and it fails loudly if dist is missing. This
# command calls the package build script once, so there is no
# recursion: the package script itself does not call this Netlify
# command, it only builds previews, the client, the prerendered
# pages, the _headers file, and the production server. No separate
# CI is added.
# Non-production indexing: the build also runs scripts/write-headers,
# which writes X-Robots-Tag: noindex to dist/public/_headers for
# deploy-preview and branch-deploy contexts only, and removes it
# for production. Netlify already adds that header to Deploy
# Previews, but not to the most recent branch deploy, and client
# robots meta only covers HTML pages, so the header step closes
# both gaps without touching production indexing.
[build]
command = "npm run check && npm run build && npm test"
publish = "dist/public"
functions = "dist"

[dev]
command = "npm run dev"
port = 5000

# Phantom URLs: paths that do not exist as pages but that search
# engines already show, because the SPA fallback below used to serve
# them as 200 root content. Each one 301s to the real page it was
# evidently meant to be. Both the slash and the no-slash form are
# listed, because Netlify may see either; do not collapse them to
# three rules until a live preview proves the no-slash forms
# redundant. These rules must stay before the /* 404 rule: Netlify
# applies the first matching rule. This file is the sole source of
# truth for the redirects: there is no TypeScript mirror, and
# tests/redirects.test.ts parses this file directly and asserts the
# mappings, ordering, and destinations.
# /guides/free-grid-paper-for-teachers/ is deliberately not listed:
# no such guide exists, so it must 404 rather than redirect anywhere.
[[redirects]]
from = "/templates/poster-hex/"
to = "/poster-hex/"
status = 301

[[redirects]]
from = "/templates/poster-hex"
to = "/poster-hex/"
status = 301

[[redirects]]
from = "/graph-paper/"
to = "/graph/"
status = 301

[[redirects]]
from = "/graph-paper"
to = "/graph/"
status = 301

[[redirects]]
from = "/guides/how-to-print-grid-paper/"
to = "/guides/how-to-print-at-actual-size/"
status = 301

[[redirects]]
from = "/guides/how-to-print-grid-paper"
to = "/guides/how-to-print-at-actual-size/"
status = 301

# No redirect from / to /templates: / is the generator itself, and
# /templates remains the library. There is no /* SPA fallback here
# any more: every real route is a prerendered static file, so direct
# loads of real pages never reach this rule, and unknown URLs must
# return a real 404 instead of 200 root content. The Express
# production server already does the same with not-found.html and a
# 404 status (see server/index-prod.ts). Netlify serves 404.html
# with a 404 status for unmatched paths; it is generated by
# scripts/prerender.ts alongside not-found.html. The explicit /*
# rule is kept on purpose, even though Netlify is widely
# documented to serve a publish-root 404.html natively: the rule
# is explicit, testable in-repo (tests/redirects.test.ts asserts
# it is the only /* rule and that it is last), and harmless,
# because existing files shadow it. Delete it only after a live
# deploy-preview check proves an unknown path still returns 404
# with the custom page and no rule.
[[redirects]]
from = "/*"
to = "/404.html"
status = 404
